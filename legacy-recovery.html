<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Восстановление истории Mafia Host</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; }
      body { max-width: 42rem; margin: 4rem auto; padding: 1rem; background: #111315; color: #f1f0eb; }
      main { padding: 1.5rem; border: 1px solid #343a40; background: #191c1f; }
      h1 { margin-top: 0; font-size: 1.4rem; }
      p { line-height: 1.5; color: #b6bbc0; }
      strong { color: #e5a84b; }
      button { min-height: 2.8rem; padding: .6rem 1rem; border: 1px solid #e5a84b; background: #e5a84b; color: #111315; font: inherit; font-weight: 800; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      #details { font-family: ui-monospace, Menlo, monospace; white-space: pre-wrap; }
      .error { color: #d77b6d; }
    </style>
    <script src="legacy-recovery.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Восстановление старой истории</h1>
      <p id="status">Проверяю старую базу браузера…</p>
      <button id="import" type="button" disabled>Перенести недостающие игры в SQLite</button>
      <p id="details"></p>
    </main>
  </body>
</html>
